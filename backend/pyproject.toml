[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evident-ai-api"
version = "0.1.0"
description = "Evidence-centered investigation API for EVIDENT AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=0.2,<1.0",
  "arq>=0.28,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pillow>=11.0,<13.0",
  "pypdf>=5.1,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "pytest-asyncio>=0.25,<2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
